<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbour board · SeaSense</title>
<meta name="description" content="Live sea conditions for every Tamil Nadu fishing zone on one screen, for harbour offices and fishing co-op TVs.">
<meta name="theme-color" content="#071a2e">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Built for a TV seen from across a room: everything scales with the screen, nothing needs a remote. */
  :root { --bg: #071a2e; --bg-2: #0b2440; --card: #0f2d4d; --card-line: #1d4570; --ink: #eaf4ff; --ink-2: #9fbfdd; --ink-3: #6f93b5;
          --sun: #ffc857; --safe: #2ecc8f; --caution: #ffb020; --danger: #ff5a5f;
          --font: "Inter", "Noto Sans Tamil", "Noto Sans Devanagari", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden;
         display: grid; grid-template-rows: auto 1fr auto; padding: 2.2vh 2.4vw; gap: 1.6vh; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 2vw; }
  .brand { display: flex; align-items: center; gap: 1vw; }
  .brand svg { width: 4.2vh; height: 4.2vh; }
  .brand b { font-size: 3.4vh; font-weight: 800; }
  .brand span { font-size: 2.2vh; color: var(--ink-2); font-weight: 600; margin-left: .6vw; }
  .right { display: flex; align-items: center; gap: 2vw; }
  .langs { display: flex; gap: .5vw; }
  .langs i { font-style: normal; font-size: 1.9vh; font-weight: 700; color: var(--ink-3); padding: .5vh .9vw; border-radius: 99px; border: 1px solid var(--card-line); }
  .langs i.on { background: var(--sun); color: #1a1200; border-color: var(--sun); }
  .clock { font-size: 3.4vh; font-weight: 800; font-variant-numeric: tabular-nums; }

  .head-row, .row { display: grid; grid-template-columns: 17% 24% 9% 9% 1fr; align-items: center; gap: 1.4vw; }
  .head-row { color: var(--ink-3); font-size: 1.7vh; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 0 1.6vw; }
  .rows { display: grid; grid-template-rows: auto repeat(5, 1fr); gap: 1.1vh; min-height: 0; }
  .row { background: var(--card); border: 1px solid var(--card-line); border-left: .9vw solid var(--lv, var(--card-line)); border-radius: 1.4vh; padding: 0 1.6vw; min-height: 0; }
  .row[data-level="safe"] { --lv: var(--safe); }
  .row[data-level="caution"] { --lv: var(--caution); }
  .row[data-level="danger"] { --lv: var(--danger); }
  .zone { font-size: 3vh; font-weight: 800; }
  .verdict { display: flex; flex-direction: column; gap: .4vh; }
  .verdict b { font-size: 3.4vh; font-weight: 800; color: var(--lv); line-height: 1.1; }
  .verdict small { font-size: 1.8vh; color: var(--ink-2); font-weight: 600; }
  .num { font-size: 3.6vh; font-weight: 800; font-variant-numeric: tabular-nums; }
  .num small { font-size: 1.7vh; color: var(--ink-2); margin-left: .3vw; font-weight: 600; }
  .best { font-size: 2.1vh; line-height: 1.35; color: var(--ink); font-weight: 600; }
  .row.err .best { color: #ffb4b6; }

  footer { display: flex; justify-content: space-between; align-items: center; gap: 2vw; color: var(--ink-2); font-size: 1.8vh; }
  footer .sos { color: #fff; background: var(--danger); font-weight: 800; padding: .8vh 1.2vw; border-radius: 1vh; font-size: 2.2vh; white-space: nowrap; }
  .live { display: inline-block; width: 1.2vh; height: 1.2vh; border-radius: 50%; background: var(--safe); margin-right: .6vw; vertical-align: middle; }
  .fade { transition: opacity .4s; }
  .fade.out { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .fade { transition: none; } }
  /* portrait phones: let it scroll and stack instead of squeezing */
  @media (max-aspect-ratio: 1/1) {
    body { overflow: auto; height: auto; display: block; padding: 16px; }
    header { flex-wrap: wrap; gap: 10px; }
    .brand { flex-wrap: wrap; }
    .brand span { flex-basis: 100%; margin-left: 0; }
    .row, .row * { min-width: 0; overflow-wrap: anywhere; }
    .head-row { display: none; }
    .rows { display: block; }
    .row { grid-template-columns: 1fr 1fr; padding: 1.6vh 3vw; margin-bottom: 1.2vh; border-left-width: 2vw; }
    .zone, .verdict { grid-column: span 1; }
    .best { grid-column: 1 / -1; }
    footer { flex-direction: column; align-items: flex-start; margin-top: 2vh; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="30" cy="16" r="8" fill="#ffc857"/><path d="M2 28c5 0 5-4 10-4s5 4 10 4 5-4 10-4 5 4 10 4v14H2z" fill="#2a7fc9"/><path d="M2 34c5 0 5-4 10-4s5 4 10 4 5-4 10-4 5 4 10 4v8H2z" fill="#1a5c99"/></svg>
    <b>SeaSense</b><span id="title">Harbour board · next 12 hours</span>
  </div>
  <div class="right">
    <div class="langs" id="langs"><i data-l="en">EN</i><i data-l="ta">தமிழ்</i><i data-l="hi">हिन्दी</i></div>
    <div class="clock" id="clock">--:--</div>
  </div>
</header>

<main class="rows fade" id="rows" aria-live="polite">
  <div class="head-row" id="headRow"><span>Zone</span><span>Trip risk</span><span>Waves</span><span>Gusts</span><span>Best time to go</span></div>
</main>

<footer>
  <div><span class="live" aria-hidden="true"></span><span id="foot">Live forecast from Open-Meteo · updates every 10 minutes · demo thresholds, not official IMD guidance</span></div>
  <div class="sos" id="sos">Emergency at sea: Coast Guard 1554</div>
</footer>

<script>
const UI = {
  en: { title: "Harbour board · next 12 hours", head: ["Zone", "Trip risk", "Waves", "Gusts", "Best time to go"],
        foot: "Live forecast from Open-Meteo · updates every 10 minutes · demo thresholds, not official IMD guidance",
        sos: "Emergency at sea: Coast Guard 1554", m: "m", kmh: "km/h", offline: "Can't reach SeaSense. Showing the last update." },
  ta: { title: "துறைமுகப் பலகை · அடுத்த 12 மணி நேரம்", head: ["பகுதி", "பயண அபாயம்", "அலை", "காற்று", "புறப்பட சிறந்த நேரம்"],
        foot: "Open-Meteo நேரடி முன்னறிவிப்பு · ஒவ்வொரு 10 நிமிடமும் புதுப்பிக்கப்படும் · டெமோ வரம்புகள், அதிகாரப்பூர்வ IMD வழிகாட்டுதல் அல்ல",
        sos: "கடலில் அவசரம்: கடலோரக் காவல்படை 1554", m: "மீ", kmh: "கி.மீ/ம", offline: "SeaSense-ஐ அணுக முடியவில்லை. கடைசி தகவல் காட்டப்படுகிறது." },
  hi: { title: "हार्बर बोर्ड · अगले 12 घंटे", head: ["क्षेत्र", "यात्रा जोखिम", "लहरें", "झोंके", "निकलने का सबसे अच्छा समय"],
        foot: "Open-Meteo का लाइव पूर्वानुमान · हर 10 मिनट अपडेट · डेमो सीमाएँ, आधिकारिक IMD मार्गदर्शन नहीं",
        sos: "समुद्र में आपात स्थिति: तटरक्षक बल 1554", m: "मी", kmh: "किमी/घं", offline: "SeaSense से जुड़ नहीं पाए। आख़िरी अपडेट दिख रहा है।" },
};
const ORDER = ["en", "ta", "hi"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fixed = new URLSearchParams(location.search).get("lang");   // ?lang=ta pins one language
let lang = UI[fixed] ? fixed : "en";
const cache = {};                                                  // last good data per language

function paint() {
  const u = UI[lang], data = cache[lang];
  document.documentElement.lang = lang;
  $("title").textContent = u.title; $("foot").textContent = u.foot; $("sos").textContent = u.sos;
  document.querySelectorAll("#langs i").forEach((i) => i.classList.toggle("on", i.dataset.l === lang));
  $("headRow").innerHTML = u.head.map((h) => `<span>${esc(h)}</span>`).join("");
  document.querySelectorAll(".row").forEach((r) => r.remove());
  if (!data) return;
  $("rows").insertAdjacentHTML("beforeend", data.zones.map((z) => z.error
    ? `<div class="row err" data-level="none"><div class="zone">${esc(z.zone)}</div><div></div><div></div><div></div><div class="best">${esc(z.error)}</div></div>`
    : `<div class="row" data-level="${esc(z.level)}">
         <div class="zone">${esc(z.zone)}</div>
         <div class="verdict"><b>${esc(z.level_word)}</b><small>${esc(z.reason)}</small></div>
         <div class="num">${z.wave_max.toFixed(1)}<small>${u.m}</small></div>
         <div class="num">${z.gust_max}<small>${u.kmh}</small></div>
         <div class="best">${esc(z.best)}</div>
       </div>`).join(""));
}

async function fetchLang(l) {
  try {
    const res = await fetch(`/api/board?lang=${l}`);
    if (!res.ok) throw new Error();
    cache[l] = await res.json();
  } catch {
    if (!cache[l]) cache[l] = null;
    $("foot").textContent = UI[l].offline;
  }
}
async function refreshAll() {
  await Promise.all((fixed ? [lang] : ORDER).map(fetchLang));
  paint();
}
function rotate() {                                                // fade between languages every 20 s
  if (fixed) return;
  $("rows").classList.add("out");
  setTimeout(() => { lang = ORDER[(ORDER.indexOf(lang) + 1) % ORDER.length]; paint(); $("rows").classList.remove("out"); }, 400);
}
function tick() {
  $("clock").textContent = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Kolkata" });
}

tick(); setInterval(tick, 15_000);
refreshAll(); setInterval(refreshAll, 10 * 60_000);
setInterval(rotate, 20_000);
</script>
</body>
</html>
