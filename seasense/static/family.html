<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip status · SeaSense</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#071a2e">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #071a2e; --bg-2: #0b2440; --card: #0f2d4d; --card-line: #1d4570; --ink: #eaf4ff; --ink-2: #9fbfdd; --ink-3: #6f93b5;
          --sun: #ffc857; --safe: #2ecc8f; --caution: #ffb020; --danger: #ff5a5f; --state: var(--ink-3);
          --font: "Inter", "Noto Sans Tamil", "Noto Sans Devanagari", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--font); }
  body[data-state="at_sea"] { --state: var(--caution); }
  body[data-state="overdue"] { --state: var(--danger); }
  body[data-state="returned"] { --state: var(--safe); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; }
  .brand svg { width: 36px; height: 36px; }
  .seg { display: inline-flex; background: var(--bg-2); border: 1px solid var(--card-line); border-radius: 999px; padding: 4px; }
  .seg button { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-2); background: none; border: 0; border-radius: 999px; padding: 7px 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--sun); color: #1a1200; }
  .card { margin-top: 24px; background: var(--card); border: 2px solid var(--state); border-radius: 20px; padding: 24px; }
  .who { color: var(--ink-2); font-size: 14px; font-weight: 600; }
  .state { font-size: 40px; font-weight: 800; color: var(--state); margin: 6px 0 12px; line-height: 1.1; }
  .text { font-size: 18px; line-height: 1.6; margin: 0; }
  .warn { margin-top: 16px; background: #3a1418; border: 1px solid var(--danger); color: #ffd1d2; border-radius: 12px; padding: 12px 14px; font-weight: 600; line-height: 1.5; }
  .call { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 18px; background: var(--danger); color: #fff; font-weight: 800; font-size: 18px;
          text-decoration: none; border-radius: 14px; padding: 16px; }
  .call svg { width: 22px; height: 22px; }
  .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  .meta div { background: var(--bg-2); border: 1px solid var(--card-line); border-radius: 12px; padding: 12px; }
  .meta b { display: block; font-size: 12px; color: var(--ink-3); margin-bottom: 4px; }
  .meta span { font-size: 17px; font-weight: 700; }
  .foot { color: var(--ink-3); font-size: 12.5px; margin-top: 18px; line-height: 1.6; }
  .error { margin-top: 24px; color: #ffd1d2; background: #3a1418; border: 1px solid var(--danger); border-radius: 14px; padding: 16px; display: none; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body data-state="none">
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="30" cy="16" r="8" fill="#ffc857"/><path d="M2 28c5 0 5-4 10-4s5 4 10 4 5-4 10-4 5 4 10 4v14H2z" fill="#2a7fc9"/><path d="M2 34c5 0 5-4 10-4s5 4 10 4 5-4 10-4 5 4 10 4v8H2z" fill="#1a5c99"/></svg>
      SeaSense
    </div>
    <div class="seg" role="group" aria-label="Language" id="langs">
      <button data-lang="en">English</button><button data-lang="ta">தமிழ்</button><button data-lang="hi">हिन्दी</button>
    </div>
  </header>

  <main class="card" id="card" aria-live="polite" hidden>
    <div class="who" id="who"></div>
    <div class="state" id="state"></div>
    <p class="text" id="text"></p>
    <div class="warn" id="warn" role="alert" hidden></div>
    <a class="call" id="call" href="tel:1554" hidden>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
      <span id="callText">Call Coast Guard 1554</span>
    </a>
    <div class="meta">
      <div><b id="lLeft">Left</b><span id="vLeft"></span></div>
      <div><b id="lBack">Back by</b><span id="vBack"></span></div>
    </div>
    <p class="foot" id="foot"></p>
  </main>
  <div class="error" id="error" role="alert"></div>
</div>

<script>
const UI = {
  en: { trip_of: "Trip of", at_sea: "At sea", overdue: "Overdue", returned: "Back safely", left: "Left", back: "Back by",
        call: "Call Coast Guard 1554", foot: "Updates every minute. Shared by the fisherman through SeaSense.", gone: "This trip link is no longer available.", offline: "Couldn't reach SeaSense. Retrying…" },
  ta: { trip_of: "பயணம்:", at_sea: "கடலில் உள்ளார்", overdue: "தாமதம்", returned: "பாதுகாப்பாகத் திரும்பினார்", left: "புறப்பட்டது", back: "திரும்ப வேண்டிய நேரம்",
        call: "கடலோரக் காவல்படை 1554-ஐ அழை", foot: "ஒவ்வொரு நிமிடமும் புதுப்பிக்கப்படும். மீனவர் SeaSense மூலம் பகிர்ந்தது.", gone: "இந்தப் பயண இணைப்பு இனி கிடைக்காது.", offline: "SeaSense-ஐ அணுக முடியவில்லை. மீண்டும் முயல்கிறது…" },
  hi: { trip_of: "यात्रा:", at_sea: "समुद्र में", overdue: "देरी", returned: "सुरक्षित लौट आए", left: "निकले", back: "लौटने का समय",
        call: "तटरक्षक बल 1554 पर कॉल करें", foot: "हर मिनट अपडेट होता है। मछुआरे ने SeaSense से साझा किया।", gone: "यह यात्रा लिंक अब उपलब्ध नहीं है।", offline: "SeaSense से जुड़ नहीं पाए। फिर कोशिश हो रही है…" },
};
const $ = (id) => document.getElementById(id);
const token = location.pathname.split("/").pop();
let lang = new URLSearchParams(location.search).get("lang") || "en";
if (!UI[lang]) lang = "en";
const fmt = (iso) => new Date(iso).toLocaleString(lang === "en" ? "en-IN" : lang + "-IN",
  lang === "en" ? { weekday: "short", hour: "numeric", minute: "2-digit", timeZone: "Asia/Kolkata" }
                : { weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: "Asia/Kolkata" });

async function load() {
  const u = UI[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("#langs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  try {
    const res = await fetch(`/api/family/${encodeURIComponent(token)}?lang=${lang}`);
    if (res.status === 404) { $("card").hidden = true; $("error").textContent = u.gone; $("error").style.display = "block"; return; }
    const s = await res.json();
    $("error").style.display = "none";
    document.body.dataset.state = s.status;
    $("card").hidden = false;
    $("who").textContent = `${u.trip_of} ${s.name} · ${s.zone}`;
    $("state").textContent = u[s.status];
    $("text").textContent = s.text;
    $("warn").hidden = !s.warning; $("warn").textContent = s.warning;
    $("call").hidden = s.status !== "overdue";
    $("callText").textContent = u.call;
    $("lLeft").textContent = u.left; $("vLeft").textContent = fmt(s.left_at);
    $("lBack").textContent = u.back; $("vBack").textContent = fmt(s.back_by);
    $("foot").textContent = u.foot;
    document.title = `${s.name}: ${u[s.status]} · SeaSense`;
  } catch {
    $("error").textContent = u.offline; $("error").style.display = "block";
  }
}
document.querySelectorAll("#langs button").forEach((b) => b.onclick = () => { lang = b.dataset.lang; load(); });
load();
setInterval(load, 60_000);
</script>
</body>
</html>
